upstream django {
    server django:8000;
}

# Rate limiting zones (declared once at http-context level; this file is
# included inside http{} by the base nginx.conf)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=flower_limit:10m rate=10r/s;

# JSON access log
log_format json_combined escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$proxy_add_x_forwarded_for",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

# Telegram requires HTTPS webhooks. This template ships HTTP-only for local/dev
# use behind an external TLS terminator (e.g. a cloud load balancer). For a
# standalone deployment, terminate TLS here instead: add a `listen 443 ssl;`
# server block with `ssl_certificate`/`ssl_certificate_key` (e.g. via certbot),
# and redirect this port-80 server to https.
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/access.log json_combined;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram webhook: forward to Django
    location ~ ^/api/telegram/webhook/.*$ {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 60s;
        client_max_body_size 32m;
    }

    location /static/ {
        alias /usr/src/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /usr/src/app/media/;
        expires 30d;
        access_log off;
    }

    # Flower UI (Celery monitoring). Defense in depth: rate limited here, and
    # FLOWER_BASIC_AUTH must be changed from its template default. Consider
    # also uncommenting an `allow <trusted-ip>; deny all;` block below once
    # you know which IPs (VPN/office) should reach it.
    location /flower/ {
        limit_req zone=flower_limit burst=10 nodelay;
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://flower:5555/flower/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    client_max_body_size 20M;
}
