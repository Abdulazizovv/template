services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - public
      - internal

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: []
    command: celery -A core worker -l INFO
    depends_on:
      - django
      - redis
    networks:
      - internal

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: []
    command: celery -A core beat -l INFO
    depends_on:
      - django
      - redis
    networks:
      - internal

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: []
    command: celery -A core flower --address=0.0.0.0 --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:admin} --url_prefix=flower
    depends_on:
      - redis
      - celery
    expose:
      - "5555"
    networks:
      - internal

  db:
    image: postgres:16.13-alpine3.23
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7.4.7-alpine3.21
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine3.23
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django
    networks:
      - public
      - internal

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  public:
  internal:
    internal: true
