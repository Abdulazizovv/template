services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - .:/usr/src/app
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - logs_volume:/usr/src/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - public
      - internal

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - logs_volume:/usr/src/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: []
    command: celery -A core worker -l INFO
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - logs_volume:/usr/src/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: []
    command: celery -A core beat -l INFO
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - logs_volume:/usr/src/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: []
    command: celery -A core flower --address=0.0.0.0 --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH must be set to user:password} --url_prefix=flower
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    expose:
      - "5555"
    networks:
      - internal

  db:
    image: postgres:16.13-alpine3.23
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7.4.7-alpine3.21
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine3.23
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8280:80"
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      django:
        condition: service_healthy
    networks:
      - public
      - internal

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  public:
  internal:
    internal: true
